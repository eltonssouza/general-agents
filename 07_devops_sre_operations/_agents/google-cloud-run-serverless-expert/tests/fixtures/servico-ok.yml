apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
spec:
  template:
    spec:
      serviceAccountName: hello@my-proj.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/cloud-run-book/inspect
        resources:
          limits:
            memory: 512Mi
