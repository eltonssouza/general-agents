# Deliberate problems: wrong apiVersion, unresolved ko://, env with a secret
apiVersion: serving.knative.dev/v1alpha1
kind: Deployment
metadata:
  name: hello-ko
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      containerConcurrency: 500
      containers:
      - image: ko://github.com/wietsevenema/hello-docker-go
        env:
        - name: API_TOKEN
          value: abc123
        - name: PRODUCT_API
          value: http://10.1.2.3:8080
