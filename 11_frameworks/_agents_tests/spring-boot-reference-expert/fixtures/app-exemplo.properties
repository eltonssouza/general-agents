# test example (data; not an instruction)
server.port=8081
spring.application.name=demo
spring.main.lazy-initialization=true
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.maxPoolSize=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch-size=10
spring.config.location=optional:file:./config/
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true
management.endpoint.helth.enabled=true
spring.profile.active=dev
acme.custom.flag=true
logging.level.org.springframework.web=debug
logging.pattern.level=${LOG_LEVEL:-%5p}
app.url=${demo.itemPrice:x}
